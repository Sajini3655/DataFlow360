name: Data Engineering CI

on:
  pull_request:
    branches: [main, "feature/**"]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  data-engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dataflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataflow -d dataflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dataflow:ci-only-password@localhost:5432/dataflow_test
      AIRFLOW_USERNAME: ci-airflow-user
      AIRFLOW_PASSWORD: ci-only-airflow-password
      DBT_HOST: localhost
      DBT_PORT: "5432"
      DBT_USER: dataflow
      DBT_PASSWORD: ci-only-password
      DBT_DATABASE: dataflow_test
      DBT_SCHEMA: analytics
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-test.txt
            dbt/requirements.txt
      - name: Install backend and dbt dependencies
        run: |
          python -m pip install -r backend/requirements-test.txt
          python -m pip install -r dbt/requirements.txt
      - name: Generate and validate a small isolated fixture
        run: |
          python scripts/generate_synthetic_data.py --records 100 --output-dir "$RUNNER_TEMP/dataflow-fixture"
          python - "$RUNNER_TEMP/dataflow-fixture" <<'PY'
          import csv
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          with (root / "sales_50000.csv").open(newline="", encoding="utf-8") as file:
              rows = list(csv.DictReader(file))
          records = json.loads((root / "sales_50000.json").read_text(encoding="utf-8"))
          assert len(rows) == 104, len(rows)
          assert len(records) == 104, len(records)
          assert any(not row["order_id"] for row in rows)
          assert any(row["unit_price"] == "not-a-price" for row in rows)
          assert any(row["quantity"] == "0" for row in rows)
          print(f"Validated {len(rows)} synthetic fixture records.")
          PY
      - name: Apply schema and validate data quality, ETL, and idempotency
        working-directory: backend
        run: |
          python -c "import main"
          python -m unittest discover -s tests -p 'test_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_data_quality.py' -v
          python -m unittest discover -s tests -p 'test_warehouse_upsert_integration.py' -v
      - name: Parse and build dbt models in isolated PostgreSQL
        working-directory: dbt
        run: |
          cp profiles.yml.example profiles.yml
          dbt deps
          dbt parse
          dbt build
