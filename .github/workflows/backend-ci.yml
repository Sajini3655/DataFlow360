name: Backend CI

on:
  pull_request:
    branches: [main, "feature/**"]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dataflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataflow -d dataflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dataflow:ci-only-password@localhost:5432/dataflow_test
      AIRFLOW_USERNAME: ci-airflow-user
      AIRFLOW_PASSWORD: ci-only-airflow-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Validate Python syntax
        run: python -m compileall -q backend scripts
      - name: Apply warehouse schema and migrations
        working-directory: backend
        run: python -c "import main"
      - name: Seed a small warehouse fixture
        working-directory: backend
        run: |
          python ../scripts/generate_synthetic_data.py --records 100
          python -c "import main; main.execute_pipeline(incremental=False, source='csv', engine='pandas')"
      - name: Run unit and PostgreSQL integration tests
        working-directory: backend
        run: python -m xmlrunner discover -s tests -v -o test-reports
      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-reports/*.xml
          if-no-files-found: warn
