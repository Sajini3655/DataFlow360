name: Docker validation

on:
  pull_request:
    branches: [main, "feature/**"]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.deploy.yml --env-file .env.deploy.example config --quiet
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t dataflow360-backend:ci .
      - name: Build standalone frontend image
        run: docker build -f frontend/Dockerfile -t dataflow360-frontend:ci --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 frontend
      - name: Start backend and PostgreSQL for a migration smoke test
        run: |
          docker compose up -d db backend
          for attempt in $(seq 1 45); do
            if curl --fail --silent --max-time 5 http://localhost:8000/health; then
              break
            fi
            sleep 2
          done
          curl --fail --show-error --max-time 10 http://localhost:8000/bi/datasets
          docker compose down --remove-orphans
