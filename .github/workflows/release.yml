name: Release validation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish tagged images to GHCR (explicit opt-in; select a version tag ref)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dataflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataflow -d dataflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dataflow:ci-only-password@localhost:5432/dataflow_test
      AIRFLOW_USERNAME: ci-airflow-user
      AIRFLOW_PASSWORD: ci-only-airflow-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: |
          python -m pip install -r backend/requirements-test.txt
          cd frontend && npm ci
      - name: Validate database-backed backend tests
        working-directory: backend
        run: |
          python -c "import main"
          python ../scripts/generate_synthetic_data.py --records 50000
          python -c "import main; main.execute_pipeline(incremental=False, source='csv', engine='pandas')"
          python -m unittest discover -s tests -v
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm run build
      - name: Build release Docker images without publishing
        run: |
          docker build -f backend/Dockerfile -t dataflow360-backend:${GITHUB_REF_NAME} .
          docker build -f frontend/Dockerfile -t dataflow360-frontend:${GITHUB_REF_NAME} \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 frontend
      - name: Generate release metadata
        run: |
          mkdir -p release-metadata
          printf '{"version":"%s","commit":"%s","images_published":false}\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" > release-metadata/release.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata-${{ github.ref_name }}
          path: release-metadata/release.json

  publish-images:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_images && startsWith(github.ref, 'refs/tags/v') }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Require public frontend API URL
        env:
          PUBLIC_API_URL: ${{ vars.DATAFLOW_PUBLIC_API_URL }}
        run: |
          if [ -z "$PUBLIC_API_URL" ]; then
            echo "::error::Set the DATAFLOW_PUBLIC_API_URL repository variable before publishing images."
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dataflow360-backend:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.DATAFLOW_PUBLIC_API_URL }}
          tags: ghcr.io/${{ github.repository_owner }}/dataflow360-frontend:${{ github.ref_name }}
