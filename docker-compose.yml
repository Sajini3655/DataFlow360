services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./warehouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_AZURE_SDK: "${INSTALL_AZURE_SDK:-false}"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      AIRFLOW_API_URL: http://airflow-webserver:8080
      AIRFLOW_USERNAME: "${AIRFLOW_USERNAME:?Set AIRFLOW_USERNAME in .env}"
      AIRFLOW_PASSWORD: "${AIRFLOW_PASSWORD:?Set AIRFLOW_PASSWORD in .env}"
      PIPELINE_INTERNAL_TOKEN: "${PIPELINE_INTERNAL_TOKEN:?Set PIPELINE_INTERNAL_TOKEN in .env}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      PARQUET_DIR: /app/parquet
      SPARK_RUNNER_URL: http://spark-runner:8083
      CLOUD_STORAGE_MODE: "${CLOUD_STORAGE_MODE:-local}"
      CLOUD_LOCAL_ROOT: "${CLOUD_LOCAL_ROOT:-/app/data/cloud}"
      AZURE_STORAGE_ACCOUNT_URL: "${AZURE_STORAGE_ACCOUNT_URL:-}"
      AZURE_STORAGE_AUTH_MODE: "${AZURE_STORAGE_AUTH_MODE:-entra}"
      AZURE_STORAGE_RETRY_TOTAL: "${AZURE_STORAGE_RETRY_TOTAL:-3}"
      AZURE_STORAGE_BRONZE_CONTAINER: "${AZURE_STORAGE_BRONZE_CONTAINER:-dataflow-bronze}"
      AZURE_STORAGE_SILVER_CONTAINER: "${AZURE_STORAGE_SILVER_CONTAINER:-dataflow-silver}"
      AZURE_STORAGE_GOLD_CONTAINER: "${AZURE_STORAGE_GOLD_CONTAINER:-dataflow-gold}"
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
      FABRIC_WORKSPACE_NAME: "${FABRIC_WORKSPACE_NAME:-}"
      FABRIC_LAKEHOUSE_NAME: "${FABRIC_LAKEHOUSE_NAME:-}"
    ports: ['8000:8000']
    volumes:
      - ./data:/app/data
      - ./data/parquet:/app/parquet
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: "${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER in .env}"
      POSTGRES_PASSWORD: "${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}"
      POSTGRES_DB: "${AIRFLOW_DB_NAME:?Set AIRFLOW_DB_NAME in .env}"
    volumes:
      - airflowpgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10
  airflow-init:
    image: apache/airflow:2.10.5-python3.12
    user: "50000:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER in .env}:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@airflow-db:5432/${AIRFLOW_DB_NAME:?Set AIRFLOW_DB_NAME in .env}"
      AIRFLOW_USERNAME: "${AIRFLOW_USERNAME:?Set AIRFLOW_USERNAME in .env}"
      AIRFLOW_PASSWORD: "${AIRFLOW_PASSWORD:?Set AIRFLOW_PASSWORD in .env}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflowlogs:/opt/airflow/logs
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users create --role Admin
        --username "$${AIRFLOW_USERNAME}"
        --password "$${AIRFLOW_PASSWORD}"
        --firstname Airflow --lastname Admin --email admin@example.com || true)
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"
  airflow-webserver:
    image: apache/airflow:2.10.5-python3.12
    user: "50000:0"
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER in .env}:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@airflow-db:5432/${AIRFLOW_DB_NAME:?Set AIRFLOW_DB_NAME in .env}"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      AIRFLOW__WEBSERVER__RBAC: 'true'
      AIRFLOW__WEBSERVER__WORKERS: '1'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      DBT_ENABLED: "${DBT_ENABLED:-false}"
      DBT_RUNNER_URL: http://dbt-runner:8080
      SPARK_RUNNER_URL: http://spark-runner:8083
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflowlogs:/opt/airflow/logs
    ports: ['8080:8080']
    command: ['webserver', '--debug']
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, 'curl', '--fail', 'http://localhost:8080/health']
      interval: 15s
      timeout: 10s
      retries: 20
  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.12
    user: "50000:0"
    environment:
      <<: *airflow-common-env
      DATAFLOW_PIPELINE_TOKEN: "${PIPELINE_INTERNAL_TOKEN:?Set PIPELINE_INTERNAL_TOKEN in .env}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflowlogs:/opt/airflow/logs
    command: scheduler
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    profiles: ['dbt']
    environment:
      DBT_HOST: db
      DBT_PORT: '5432'
      DBT_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      DBT_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      DBT_DATABASE: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      DBT_SCHEMA: analytics
    volumes:
      - ./dbt:/usr/app
    depends_on:
      db:
        condition: service_healthy
  dbt-runner:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    profiles: ['dbt']
    entrypoint: ['uvicorn']
    command: ['runner:app', '--host', '0.0.0.0', '--port', '8080']
    environment:
      DBT_HOST: db
      DBT_PORT: '5432'
      DBT_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      DBT_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      DBT_DATABASE: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      DBT_SCHEMA: analytics
      PIPELINE_INTERNAL_TOKEN: "${PIPELINE_INTERNAL_TOKEN:?Set PIPELINE_INTERNAL_TOKEN in .env}"
    ports: ['8081:8080']
    volumes:
      - ./dbt:/usr/app
    depends_on:
      db:
        condition: service_healthy
  spark-master:
    build:
      context: .
      dockerfile: spark/Dockerfile
    profiles: ['spark']
    command:
      - spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - '7077'
      - --webui-port
      - '8080'
    ports: ['7077:7077', '8082:8080']
    mem_limit: 2g
    healthcheck:
      test: [CMD-SHELL, 'curl --fail http://localhost:8080/ >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
  spark-worker:
    build:
      context: .
      dockerfile: spark/Dockerfile
    profiles: ['spark']
    volumes:
      - ./data:/app/data
      - ./data/parquet:/app/parquet
    command:
      - spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - '2'
      - --memory
      - 2g
    mem_limit: 2g
    depends_on:
      spark-master:
        condition: service_healthy
  spark-runner:
    build:
      context: .
      dockerfile: spark/Dockerfile
    profiles: ['spark']
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      PIPELINE_INTERNAL_TOKEN: "${PIPELINE_INTERNAL_TOKEN:?Set PIPELINE_INTERNAL_TOKEN in .env}"
      DATA_DIR: /app/data
      SPARK_OUTPUT_DIR: /app/parquet/spark
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_DRIVER_HOST: spark-runner
    ports: ['8083:8083']
    volumes:
      - ./data:/app/data
      - ./data/parquet:/app/parquet
    healthcheck:
      test: [CMD-SHELL, 'curl --fail http://localhost:8083/health']
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      db:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_started
volumes:
  pgdata:
  airflowpgdata:
  airflowlogs:
