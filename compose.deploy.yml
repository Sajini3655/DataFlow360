services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./warehouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_AZURE_SDK: "false"
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}"
      AIRFLOW_API_URL: "${AIRFLOW_API_URL:-http://airflow-webserver:8080}"
      AIRFLOW_USERNAME: "${AIRFLOW_USERNAME:-}"
      AIRFLOW_PASSWORD: "${AIRFLOW_PASSWORD:-}"
      PIPELINE_INTERNAL_TOKEN: "${PIPELINE_INTERNAL_TOKEN:?Set PIPELINE_INTERNAL_TOKEN}"
      CORS_ORIGINS: "${CORS_ORIGINS:?Set CORS_ORIGINS}"
      PARQUET_DIR: /app/parquet
      CLOUD_STORAGE_MODE: "${CLOUD_STORAGE_MODE:-local}"
      CLOUD_LOCAL_ROOT: /app/data/cloud
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - parquet_data:/app/parquet
      - cloud_data:/app/data/cloud
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${PUBLIC_API_URL:?Set PUBLIC_API_URL to the HTTPS API origin}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 12
    networks: [private]

networks:
  private:
    driver: bridge

volumes:
  postgres_data:
  parquet_data:
  cloud_data:
